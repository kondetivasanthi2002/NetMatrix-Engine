[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netmatrix-suite"
version = "1.0.0"
description = "NetMatrix Enterprise Network Observability & Management Suite"
readme = "README.md"
authors = [{ name = "NetMatrix Core Team", email = "dev@netmatrix.io" }]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pytest>=7.0.0",
]
